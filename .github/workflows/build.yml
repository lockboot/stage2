name: build

on:
  push:
    branches: [main]
    # Release track gated by tag prefix:
    #   stage2-v*  → the reusable loader binaries (append your own container image to run it).
    tags: ['stage2-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---- Quality gates (fmt-check + check + clippy + test) --------------------
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # Everything runs inside lockboot:build (built on demand by the Makefile's docker-build-base
      # prerequisite) on the pinned toolchain -- no host Rust is installed. GitHub sets CI=true, so
      # the Makefile's CACHE_ENV redirects cargo/rustup homes to /tmp inside the container.
      - name: CI (fmt-check + check + clippy + test)
        run: make ci

  # ---- Build + pack the loader for both arches ------------------------------
  build:
    name: build-${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      matrix:
        arch: [x86_64, aarch64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # Exercises the whole packaging pipeline: build the loader (static musl), forge the
      # deterministic erofs+dm-verity+ext4 payload in lockboot:erofs-builder, and append it as a
      # self-extracting zip (make pack -> build/<arch>/pack/stage2). No stage0/stage1 artifacts are
      # needed; the boot test (test-pivot) is NOT run here (GitHub runners have no KVM).
      - name: Build + pack loader for ${{ matrix.arch }}
        run: |
          make pack-${{ matrix.arch }}
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/bootstrap stage2-loader-${{ matrix.arch }}

      # The reusable loader binary + a packed demo (loader + the pivot-init /init) for inspection
      # (`unzip -l`) or a local boot test.
      - name: Upload loader + packed demo for ${{ matrix.arch }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage2-${{ matrix.arch }}
          path: |
            stage2-loader-${{ matrix.arch }}
            build/${{ matrix.arch }}/pack/stage2

  # ---- Release track (tag: stage2-v*): the reusable loader binaries ---------
  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/stage2-v')
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download loader artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stage2-*
          merge-multiple: true

      - name: Attest loader binaries
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            stage2-loader-x86_64
            stage2-loader-aarch64

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            stage2-loader-x86_64
            stage2-loader-aarch64
          draft: false
          prerelease: true
          generate_release_notes: true
          make_latest: true
