name: build

on:
  push:
    branches: [main]
    # Release track gated by tag prefix:
    #   v*  → the reusable loader binaries (append your own container image to run it).
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---- Quality gates (fmt-check + check + clippy + test) --------------------
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # Everything runs inside lockboot:build (built on demand by the Makefile's docker-build-base
      # prerequisite) on the pinned toolchain -- no host Rust is installed. GitHub sets CI=true, so
      # the Makefile's CACHE_ENV redirects cargo/rustup homes to /tmp inside the container.
      - name: CI (fmt-check + check + clippy + test)
        run: make ci

  # ---- Build + pack the loader for both arches ------------------------------
  build:
    name: build-${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      matrix:
        arch: [x86_64, aarch64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # Exercises the whole packaging pipeline: build the loader (static musl), forge the
      # deterministic erofs+dm-verity+ext4 payload in lockboot:erofs-builder, and append it as a
      # self-extracting zip (make pack -> build/<arch>/pack/stage2). No stage0/stage1 artifacts are
      # needed; the boot test (test-pivot) is NOT run here (GitHub runners have no KVM).
      - name: Build + pack loader for ${{ matrix.arch }}
        run: |
          make pack-${{ matrix.arch }}
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/bootstrap stage2-loader-${{ matrix.arch }}
          cp tools/stage2.replay.json .

      # The reusable loader binary + a packed demo (loader + the pivot-init /init) for inspection
      # (`unzip -l`) or a local boot test.
      - name: Upload loader + packed demo for ${{ matrix.arch }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage2-${{ matrix.arch }}
          path: |
            stage2-loader-${{ matrix.arch }}
            stage2.replay.json
            build/${{ matrix.arch }}/pack/stage2

  # ---- Release track (tag: v*): the reusable loader binaries ---------
  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download loader artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stage2-*
          merge-multiple: true

      - name: Attest loader binaries
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            stage2-loader-x86_64
            stage2-loader-aarch64
            stage2.replay.json

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            stage2-loader-x86_64
            stage2-loader-aarch64
            stage2.replay.json
          draft: false
          prerelease: true
          generate_release_notes: true
          make_latest: true

  # ---- erofs-builder image (tag: v*) ---------------------------------
  # End-user forge: mkruntime + pinned erofs/verity/ext4 tools + this release's loaders for BOTH
  # arches baked in (`--arch <arch>`), so packing needs no separate loader download. Multi-arch so
  # it runs identically on amd64 and arm64 build hosts. Consumers pin the digest appended to the
  # release notes below, not the tag.
  release-erofs-builder:
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # The same artifacts the `release` job attested and published.
      - name: Download loader artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stage2-*
          merge-multiple: true

      - name: Set up QEMU (arm64 layers on the amd64 runner)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}-erofs-builder
          tags: |
            type=ref,event=tag
          flavor: |
            latest=false

      - name: Build and push multi-arch erofs-builder
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile.erofs-builder
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true

      - name: Attest erofs-builder image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ghcr.io/${{ github.repository }}-erofs-builder
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Append image digest + baked loader hashes to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          gh release view "$TAG" -R "${{ github.repository }}" --json body -q .body > notes.md
          {
            echo
            echo "### erofs-builder image"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository }}-erofs-builder@${DIGEST}"
            echo '```'
            echo
            echo "Bakes in (\`--arch <arch>\`):"
            echo
            echo '```'
            sha256sum stage2-loader-x86_64 stage2-loader-aarch64
            echo '```'
          } >> notes.md
          gh release edit "$TAG" -R "${{ github.repository }}" --notes-file notes.md
