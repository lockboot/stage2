[workspace]
members = ["crates/bootstrap", "crates/tpm-derive", "crates/blockdev", "crates/payload"]
resolver = "2"

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2021"

[workspace.dependencies]
libc = "0.2"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
gpt = "4.1"
uuid = "1"
# Pure-Rust (miniz_oxide) gzip — static-musl clean, no C. Decompresses the embedded ext4 base.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Local crates
tpm-derive = { path = "crates/tpm-derive" }
blockdev = { path = "crates/blockdev" }
payload = { path = "crates/payload" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
